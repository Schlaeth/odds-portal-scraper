[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-portal-scraper"
version = "3.0.0"
description = "CLI tool for scraping soccer odds from oddsportal.com"
readme = "README.MD"
requires-python = ">=3.10"
authors = [{ name = "" }]
license = "ISC"
dependencies = [
    "typer>=0.9,<1.0",
    "rich>=13.7,<14.0",
    "boto3>=1.34,<2.0",
    "playwright>=1.42,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
odds-portal = "odds_portal_scraper.cli:app"

[tool.setuptools.packages.find]
include = ["odds_portal_scraper*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
